[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default run options:
#   -ra            show extra summary for all except passed
#   --strict-markers  fail on unknown markers (keeps the marker list honest)
#   --html         self-contained HTML report under reports/
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Registered markers (enforced by --strict-markers)
markers =
    smoke: fast critical-path checks suitable for CI gate
    regression: broader coverage run
    users: tests for the Users service
    posts: tests for the Posts service
    schema: response schema-contract validation
    negative: negative / error-path testing

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
