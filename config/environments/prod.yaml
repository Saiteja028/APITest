# Production environment configuration.
# NEVER commit real production secrets here. Use env vars / a secrets manager.
name: prod
base_url: https://jsonplaceholder.typicode.com
timeout_ms: 30000
ignore_https_errors: false

default_headers:
  Accept: application/json
  Content-Type: application/json

auth:
  strategy: bearer
  token: ""          # inject via API_TOKEN env var
  username: ""
  password: ""
  api_key_header: X-API-Key
  api_key: ""

services:
  users: /users
  posts: /posts
  comments: /comments
